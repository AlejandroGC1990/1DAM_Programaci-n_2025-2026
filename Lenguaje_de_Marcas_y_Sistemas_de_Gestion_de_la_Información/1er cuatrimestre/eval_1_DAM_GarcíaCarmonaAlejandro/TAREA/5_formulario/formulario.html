<!DOCTYPE html>
<html>
  <head>
    <title>ejercicio para la evaluación 1 / formulario</title>
    <meta charset="UTF-8" />
  </head>
  <header>
    <h3>Formularios</h3>
  </header>
  <body>
    <form
      action="mailto:agc773@educa.madrid.org"
      method="post"
      style="border: 1px"
    >
      <fieldset>
        <legend>Datos personales</legend>
        <p>
          <label for="nombre">Nombre</label><br />
          <input type="text" id="nombre" name="nombre" required />
        </p>
        <p>
          <label for="edad">Edad (Solo debe aceptar un número):</label><br />
          <input type="number" id="edad" name="edad" />
        </p>
        <p>
          <label for="email">Email</label><br />
          <input type="email" id="email" name="email" />
        </p>
        <p>
          <label for="curso">Curso</label><br />
          <select id="curso" name="curso">
            <option value="">Escoge tu grupo</option>
            <option value="1dam">1º DAM</option>
            <option value="2dam">2º DAM</option>
            <option value="1daw">1º DAW</option>
            <option value="2daw">2º DAW</option>
            <option value="1asir">1º ASIR</option>
            <option value="2asir">2º ASIR</option>
          </select>
        </p>
        <p>
          <label for="comentarios">Comentarios</label><br />
          <textarea id="comentarios" name="comentarios" rows="5" cols="60">
          </textarea>
        </p>

        <button type="submit">Enviar Datos</button>
      </fieldset>
    </form>
    <a href="../index.html">Volver al índice</a>
  </body>
</html>
