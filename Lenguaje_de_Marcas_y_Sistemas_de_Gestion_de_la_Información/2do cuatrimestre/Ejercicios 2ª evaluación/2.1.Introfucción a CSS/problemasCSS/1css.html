<!DOCTYPE html>
<html>
  <head>
    <title>
      Lenguajes de Marcas y Sistemas de Gestión de Información - CSS
    </title>
  </head>
  <body>
    <header>
      <h1>Definición de estilos a nivel de elemento HTML.</h1>
    </header>

    <main>
      <p>
        Crear una página HTML y definir tres títulos empleando los elemento h1,
        h2 y h3. Definir el mismo color para el texto de cada bloque y colores
        diferentes para el fondo de los mismos.
      </p>

      <div>
        <h1 style="color: #7c102f; background-color: #8a5612">Tubérculo</h1>
        <h2 style="color: #7c102f; background-color: #36125d">Patata</h2>
        <h3 style="color: #7c102f; background-color: #f2779a">Boniato</h3>
      </div>
    </main>
  </body>
</html>
